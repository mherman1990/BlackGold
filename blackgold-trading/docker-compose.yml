version: "3.7"

# Black Gold Umbrel app. One image, two roles. All mutable state lives under ${APP_DATA_DIR}/data.
# The image tag below must equal umbrel-app.yml `version` and package.json `version` (CI enforces it).
# The @sha256 digest is filled in by the release process once the multi-arch manifest exists.

services:
  app_proxy:
    environment:
      APP_HOST: blackgold-trading_core_1
      APP_PORT: 8479

  core:
    image: ghcr.io/mherman1990/blackgold:0.1.5@sha256:f2b4549a8debbc28c40422e69083da20edd5ad79e99f02be4c4ad4aa648ce178
    # The image ENTRYPOINT is `node`; the command supplies only the script and arguments.
    command: ["packages/core/dist/main.js", "serve"]
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BLACKGOLD_ROLE: core
      BLACKGOLD_MODE: RESEARCH
      BLACKGOLD_DATA_DIR: /data
      BLACKGOLD_HTTP_PORT: "8479"
      TZ: UTC
      # Model-provider API key for the research LLM overlay. Passed through from the app environment on the Pi
      # (a gitignored secrets file, never this repo, never the image). Empty default so a missing key does not
      # break startup: with no key the analyst simply abstains. Not a broker credential and cannot trade.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Stage-1 public research-data credentials (docs/ACCESS_AND_CREDENTIALS.md), passed through from the app
      # environment (~/umbrel/app-data/blackgold-trading/.env) the same way. All free, none touch a brokerage
      # account or move a dollar. Empty defaults so startup never breaks; the `ingest` command run inside this
      # container (see docs/runbooks/first-ingestion.md) reads them, and fails fast if a needed one is absent.
      BLACKGOLD_SEC_USER_AGENT_CONTACT: ${BLACKGOLD_SEC_USER_AGENT_CONTACT:-}
      BLACKGOLD_ALPACA_KEY_ID: ${BLACKGOLD_ALPACA_KEY_ID:-}
      BLACKGOLD_ALPACA_SECRET_KEY: ${BLACKGOLD_ALPACA_SECRET_KEY:-}
      BLACKGOLD_FRED_API_KEY: ${BLACKGOLD_FRED_API_KEY:-}
      BLACKGOLD_TIINGO_API_KEY: ${BLACKGOLD_TIINGO_API_KEY:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD", "node", "packages/core/dist/main.js", "health"]
      interval: 60s
      timeout: 20s
      retries: 3

  gateway:
    image: ghcr.io/mherman1990/blackgold:0.1.5@sha256:f2b4549a8debbc28c40422e69083da20edd5ad79e99f02be4c4ad4aa648ce178
    command: ["packages/broker-gateway/dist/main.js", "serve"]
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    environment:
      BLACKGOLD_ROLE: gateway
      BLACKGOLD_DATA_DIR: /data
      TZ: UTC
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # No ports exposed and no app_proxy route. Core reaches the gateway only on the app-private network.
    # Phase 0: the gateway holds no credential and offers only the synthetic broker.
    healthcheck:
      test: ["CMD", "node", "packages/broker-gateway/dist/main.js", "health"]
      interval: 60s
      timeout: 20s
      retries: 3
