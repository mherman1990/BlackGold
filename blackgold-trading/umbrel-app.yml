description: >-
  Black Gold researches, shadows, paper trades, and (only after explicit owner
  authorization in a much later release) executes a narrowly approved systematic
  strategy for a single ring-fenced brokerage account. Deterministic code owns
  every number and every hard boundary. Live trading is absent by construction
  in this release. Not investment advice.
releaseNotes: >-
  0.1.13 ships the prospective shadow track: sealed weekly decision records,
  simulated fills against a synthetic book, and a ledger reconciler, plus ETF
  theme look-through from published SSGA holdings. All of it stays off on this
  release's settings (research mode, no shadow charter configured), and it must
  stay off: the shadow fills carry known defects being repaired. Research
  evaluation now computes the charter's registered primary metric as a
  difference of Sharpe ratios, builds the vol-targeted Secondary 2 comparator,
  and returns one verdict over the pooled walk-forward splits; numbers from
  0.1.12 are not comparable. Two additive database migrations run on first
  start. Take a backup before updating; see CHANGELOG.md.

  What this release does NOT do. Live trading is absent by construction and no
  broker credential exists anywhere in the project. The shadow jobs touch no
  broker, account, or real dollar. No experiment is registered and no result is
  citable as evidence. Not investment advice.
