tagline: Evidence-first research and controlled execution for one ring-fenced sleeve
icon: https://raw.githubusercontent.com/mherman1990/BlackGold/main/blackgold-trading/icon.svg
description: >-
  Black Gold researches, shadows, paper trades, and (only after explicit owner
  authorization in a much later release) executes a narrowly approved systematic
  strategy for a single ring-fenced brokerage account. Deterministic code owns
  every number and every hard boundary. Live trading is absent by construction
  in this release. Not investment advice.
releaseNotes: >-
  0.1.14 brings the corporate-actions reconciliation to the Pi: the new
  reconcile corporate-actions command builds the unsigned two-source
  corporate-actions file for the signed 0.3.0 charter from Tiingo, State
  Street, and the Vanguard and iShares files you download, with a report to
  audit before you sign it. Ingest now refuses a corporate-actions file you
  have not signed. Also included: the signed 0.3.0 charter and risk.yaml 0.2.0,
  the repaired shadow fills, the sticky shadow halt, and the liquidity and
  order-level limits. No database migration. Take a backup before updating;
  see CHANGELOG.md.

  What this release does NOT do. Live trading is absent by construction and no
  broker credential exists anywhere in the project. The shadow jobs stay off
  (research mode, no shadow charter) and touch no broker, account, or real
  dollar. No experiment is registered and no result is citable as evidence.
  Not investment advice.
