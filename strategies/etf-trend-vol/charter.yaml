# Machine-readable companion to ALPHA_CHARTER.md. The prose charter is the specification a human reads;
# this file is the only form the code executes.
#
# STATUS: DRAFT (charter_version 0.3.0) - AWAITING OWNER SIGNATURE. The approval block below is unsigned;
# this banner only describes it, and must be corrected in the same change that signs it.
#
# 0.3.0 is the one-batch cut the 2026-09-21 decision packet called for: every charter question that would
# otherwise reset the prospective clock after registration, settled together before it. The owner answered
# each on 2026-10-05; the answers are recorded as OD-5..OD-10 below and in docs/DECISIONS.md#D-55, and become
# binding when he signs. In short: the Sharpe-difference primary metric is KEPT, and F2 becomes a co-gate on
# section 17's REGISTERED -> ACTIVE step, read on chain-linked curves (OD-5, OD-6); a failed primary with
# Secondary 2 beaten goes to owner review and never to ACTIVE (OD-7); section 14.3's minimum is restated as
# the schedule's capacity, 100 (OD-8); Secondary 2's two readings are confirmed (OD-9); the prospective clock
# runs from registration (OD-10). component_versions.features moves 1 -> 2 to match the code
# (FEATURES_VERSION 2, the corporate-action dedupe fix) - provenance only, proposed by Claude Code and
# confirmed only by the signature.
#
# Any charter edit is a new strategy version: 0.3.0 inherits none of 0.2.0's evidence, and 0.2.0 has none to
# lose (nothing registered, nothing citable). The signed 0.2.0 file is frozen at
# packages/core/test/fixtures/etf-trend-vol-charter-0.2.0-signed.yaml with its hash sha256:5c7f94da...0d25.
#
# TO SIGN (the owner's act, from his own account - Claude Code must never fill these, CLAUDE.md carve-out):
# set approval.state to APPROVED and fill approved_by, approval_date and code_commit (the commit you reviewed);
# then change the first line of this banner to say APPROVED. Until then `assertRegistrable` refuses this file
# and the strategy-charter tripwire test is red - the gate working, not a defect.
#
# Comments here are not hash-covered: charterHash is sha256 over the canonical JSON of the PARSED charter
# (charter.ts), so no banner edit can alter a hash.

strategy_id: etf-trend-vol
charter_version: 0.3.0
prose_charter: strategies/etf-trend-vol/ALPHA_CHARTER.md
runtime_llm_in_signal: false
arms: [B0_PASSIVE, B1_DETERMINISTIC]

approval:
  # UNSIGNED. To sign: set `state` to APPROVED and fill `approved_by`, `approval_date`, `code_commit`.
  # Claude Code must not fill these (CLAUDE.md carve-out). 0.2.0 was signed 2026-09-12 against 115dae4 (D-50).
  state: DRAFT
  approved_by: null
  approval_date: null
  code_commit: null
  approval_ref: "docs/DECISIONS.md#D-55"
  decision_refs: [D-08, D-09, D-10, D-15, D-19, D-24, D-50, D-51, D-55]
  conditions: []
  # ALPHA_CHARTER.md section 24. Each needs a written resolution before registration.
  open_decisions:
    - id: OD-1
      question: "Compliance policy on diversified-ETF look-through (decides XLE, flags XLI and XLP)."
      resolution: >-
        Look-through applies to diversified ETFs. XLE is NOT admitted: it holds refiners with direct RFS and
        45Z exposure, which is a restricted theme for this operator. The risk universe is therefore 12 ETFs.
        XLI and XLP remain look-through flagged and are admitted, their restricted-theme exposure being
        incidental rather than definitional. Chosen as the reversible-in-the-safe-direction option: wrongly
        holding XLE is a professional conflict question, wrongly excluding it costs marginal diversification.
        Interim pending the counsel review that D-14 still records as outstanding; counsel may widen this but
        may not narrow it without a new charter version. Owner decision, 2026-09-07 (D-39).
    - id: OD-2
      question: "Live cash instrument: BIL, SGOV, or plain cash."
      resolution: >-
        BIL, as the frozen universe already assumes. Deep liquidity and a negligible spread matter more here
        than SGOV's ~5bp expense advantage, and holding a T-bill ETF rather than plain cash keeps short-rate
        carry on idle sleeve cash. No universe change required. Owner decision, 2026-09-07 (D-39).
    - id: OD-3
      question: "Approval of the risk.yaml defaults cited here: 20% ETF cap, 2% minimum cash, 1% ADV participation, 10% volatility target."
      resolution: >-
        Approved as they stand in config/examples/risk.yaml: maxSingleEtfWeightPct 0.20, minCashPct 0.02,
        maxAdvParticipationPct 0.01, targetAnnualizedVolPct 0.10. Note the question's own text previously said
        "0.5% ADV participation" while the file said 1%; the owner resolved that in favour of the file, and
        the question text above is corrected to match. Owner decision, 2026-09-07 (D-39).
    - id: OD-4
      question: "Approval of the free market-data source after the capability probe (D-24, CR-09)."
      resolution: >-
        Owner-signed with 0.2.0 on 2026-09-12 (D-50), carried unchanged into 0.3.0: adopt Tiingo free tier, EOD daily bars
        (tiingo.eod.bars.1d), replacing the Alpaca IEX feed approved at 0.1.0 (D-39). Reason: Alpaca's free IEX
        feed only reaches ~2018, so the registered design window 2007-06-01..2018-12-31 cannot be run on it;
        Tiingo serves the whole universe back past 2007 (verified on the Pi: 96,288 raw bars 2000-2026; coverage
        over the design split returns uncovered:[] once the baked-in NYSE ad-hoc closures apply, coverageRatio
        0.9986). Prices are raw OHLCV as decimal strings, availableAt = close + 60 min (estimated) - the same
        point-in-time treatment as Alpaca. Corporate actions come from `ingest tiingo-actions` (D-49), flagged
        UNVERIFIED_SINGLE_SOURCE (usable for research and decisions, never promotion evidence) until a
        >=2-source reconciled ledger exists. On CR-09: Tiingo's daily volume is composite, not IEX-only, so the
        ADV cap no longer reads artificially low - ADV participation binds on full-tape volume, the intended
        behavior. This is a new strategy version (0.2.0) and does not inherit 0.1.0's evidence. Owner decision
        recorded on signing (D-50).
    # OD-5..OD-10: the 0.3.0 bundle. Each resolution records the owner's answer of 2026-10-05 (D-55); the
    # signature on this block is what makes them binding.
    - id: OD-5
      question: "B-1 / D-51: is the Sharpe-difference primary metric the right promotion gate for a strategy whose stated purpose is drawdown reduction?"
      resolution: >-
        Keep net_sharpe_difference_vs_primary_benchmark as the primary metric, with its threshold, bootstrap and
        deflation unchanged. Add F2 (maximum drawdown at or below 0.75x the primary benchmark's) as a CO-GATE on
        section 17's REGISTERED -> ACTIVE transition: ACTIVE needs the primary metric passed AND F2 cleared on the
        aggregate walk-forward out-of-sample set, plus the owner's written acceptance. In addition to the primary
        metric, never instead of it: a conjunction can only make promotion harder, so this is not choosing the
        metric the strategy passes, and F2 and its 0.75 ratio were already registered (section 13 names 0.75 as
        the target), so no new threshold is introduced. Encoded as pass_fail.promotion_co_gates [F2]. Section
        16.1's rejection rule is unchanged. Owner decision, 2026-10-05 (D-55).
    - id: OD-6
      question: "F2 at the aggregate scope: each walk-forward window restarts from cash, so which maximum drawdown does the co-gate read?"
      resolution: >-
        The chain-linked curve. Each split's levels are rescaled to start where the previous split's curve ended,
        for the strategy and for the primary benchmark alike, and F2 compares the two curves' maximum drawdowns.
        The same construction the second section 16.1 prong uses for total returns, and unlike a worst-window
        reading it catches a drawdown that runs across a split boundary. A data gap in a held instrument
        withholds the co-gate in both directions, the owner's gap rule for both 16.1 prongs (D-51). Owner
        decision, 2026-10-05 (D-55).
    - id: OD-7
      question: "Sections 16.1 and 17 disagree when the primary metric fails and Secondary 2 is beaten. Which governs?"
      resolution: >-
        Section 16.1 governs rejection and section 17 governs promotion. The mixed case goes to owner review,
        and that review may end in REJECTED or in a new charter version - never in ACTIVE on a failed primary
        metric. Encoded as pass_fail.mixed_verdict OWNER_REVIEW_NEVER_ACTIVE. Owner decision, 2026-10-05 (D-55).
    - id: OD-8
      question: "Section 14.3 sets a minimum of 150 monthly-equivalent out-of-sample blocks; the registered walk-forward schedule reaches 102. Which is wrong?"
      resolution: >-
        The minimum. minimum_independent_decisions is 100, stated plainly as the registered schedule's capacity
        rather than as an independent statistical requirement: 9 splits tiling 2010-06-28..2018-12-31, 2,143
        sessions, 102 blocks of 21. 150 is unreachable inside the 2007-06-01..2018-12-31 design window under any
        schedule (the whole window is 2,917 sessions, 138 blocks), and section 14.3's own counts were wrong (it
        said about 155 in design and 72 in holdout; the calendar gives 138 and 71). Extending the schedule's span
        was declined: shortening the walk-forward window to pull 2008 into the set would be a boundary chosen
        after the 2026-09-13 design run showed how the strategy did there. The clause requiring the set to span
        two VTI drawdowns of 20% or more becomes a disclosure, not a precondition: 2007-2009 falls in the first
        training window, 2011 and 2018 Q4 are each near the 20% line (unverified on the store), and 2020 and 2022
        are in the sealed holdout. Owner decision, 2026-10-05 (D-55).
    - id: OD-9
      question: "Section 11 is silent on Secondary 2's re-scaling cadence and on ex-date income on a rebalance session. Confirm or overrule the implemented readings?"
      resolution: >-
        Both confirmed as implemented. Secondary 2 re-scales weekly, at the strategy's own decision instants; on
        a session that is both an ex-date and a rebalance, the distribution is cash to the pre-open holder and is
        reallocated at the open with the rebalance. Encoded as benchmarks.secondary_2_readings, which also
        removes the open-reading caveat from every section 16.1 verdict under this version. Owner decision,
        2026-10-05 (D-55).
    - id: OD-10
      question: "Do prospective decisions count toward section 17's 26-week SHADOW -> PAPER and section 14.3's 52-week minimums from experiment registration, or from ACTIVE acceptance?"
      resolution: >-
        From experiment registration, as section 14.2 already says: every weekly decision sealed before the next
        open from registration onward counts. The decisions are sealed either way, so the stricter reading would
        delay evidence without adding safety; promotion past SHADOW still requires ACTIVE under section 17.
        Owner decision, 2026-10-05 (D-55).

universe:
  universe_id: etf_trend_vol_v0
  frozen: true
  # ALPHA_CHARTER.md section 2.1. Ordered as the prose table is, not by rank.
  risk_etfs: [VTI, QQQ, IWM, VTV, VUG, XLK, XLF, XLV, XLI, XLP, XLU, XLY, XLE]
  cash_etf: BIL
  conditional:
    - symbol: XLE
      condition: "Holds refiners with RFS/45Z exposure (restricted theme). Admitted only if the compliance policy adopts a diversified-ETF look-through rule that admits it; otherwise the risk universe is 12 ETFs."
      admitted: false
  look_through_flagged: [XLI, XLP]
  survivorship_free: true
  survivorship_note: >-
    All members were chosen in 2026 and all survived: mild selection bias, disclosed rather than eliminated.
    Every risk ETF is among the largest and oldest in its category and would have been an obvious choice at
    any point since 2007; nothing launched after 2007 is included.

posture:
  long_only: true
  unlevered: true
  regular_session_only: true
  max_gross_exposure: "0.98"

# Deterministic factor classification (docs/PRODUCT_SPEC.md sections 6 and 11): the code-side authority the
# Analyst's `factorsTouched` is checked against. These assignments are HASH-COVERED, so they are part of the
# charter the owner signed on 2026-09-08 (D-48) and are frozen into the approved charter - the earlier
# "edit before signing" advisory is overtaken. They are conservative, widely-agreed long-only exposures; the
# owner may still revise them, but changing any tag is now a new charter version at DRAFT. A symbol left
# unassigned is unclassified and fails closed (blocks new risk). XLE is classified though not yet admitted, so
# admitting it later needs no new factor edit.
factors:
  taxonomy:
    - market
    - size
    - value
    - growth
    - momentum
    - rates
    - sector_technology
    - sector_financials
    - sector_healthcare
    - sector_industrials
    - sector_staples
    - sector_utilities
    - sector_discretionary
    - sector_energy
  assignments:
    VTI: [market]
    QQQ: [market, growth, sector_technology]
    IWM: [market, size]
    VTV: [market, value]
    VUG: [market, growth]
    XLK: [market, growth, sector_technology]
    XLF: [market, value, sector_financials]
    XLV: [market, sector_healthcare]
    XLI: [market, sector_industrials]
    XLP: [market, value, sector_staples]
    XLU: [market, value, sector_utilities]
    XLY: [market, growth, sector_discretionary]
    XLE: [market, value, sector_energy]
    BIL: [rates]

# ALPHA_CHARTER.md section 6.1.
features:
  momentum_lookback_sessions: 252
  momentum_skip_sessions: 21
  trend_sma_sessions: 200
  volatility_sessions: 63
  adv_sessions: 20
  min_adv_usd: "50000000"

# ALPHA_CHARTER.md section 8.
rules:
  cadence: WEEKLY_LAST_SESSION
  decision_offset_minutes: 60
  execution_delay_bars: 1
  fill_reference: NEXT_SESSION_OPEN
  entry_rank: 5
  hold_rank: 7
  max_positions: 5
  max_new_positions_per_decision: 5
  rebalance_band_pct_points: "2.0"

# ALPHA_CHARTER.md section 9.
sizing:
  weighting: INVERSE_VOLATILITY
  max_weight_per_etf: "0.20"
  min_cash_weight: "0.02"
  annual_volatility_target: "0.10"
  clusters:
    - id: A
      members: [VTI, QQQ, VUG, XLK, XLY]
      max_members: 3
  whole_shares_only: true

# ALPHA_CHARTER.md section 12. Half spreads are per symbol in bps; `default` covers anything unlisted.
costs:
  base:
    commission_bps: "0"
    half_spread_bps:
      default: "2"
      VTI: "1"
      QQQ: "1"
      BIL: "1"
    slippage_bps: "5"
    market_impact_bps: "0"
    delay_bars: 1
  adverse:
    commission_bps: "0"
    half_spread_bps:
      default: "4"
      VTI: "2"
      QQQ: "2"
      BIL: "2"
    slippage_bps: "10"
    market_impact_bps: "0"
    delay_bars: 2
  stress:
    commission_bps: "0"
    half_spread_bps:
      default: "8"
      VTI: "4"
      QQQ: "4"
      BIL: "4"
    slippage_bps: "20"
    market_impact_bps: "2"
    delay_bars: 3
  stress_multipliers: ["1.0", "2.0", "4.0"]
  delay_sensitivity_bars: [0, 1, 2, 5]
  missing_data_rates: ["0.00", "0.02", "0.05"]
  max_participation_of_adv: "0.005"

# ALPHA_CHARTER.md section 14.1. The holdout is sealed and stays closed in Phase 2.
boundaries:
  registered_history_start: 2007-06-01
  design: { start: 2007-06-01, end: 2018-12-31 }
  holdout: { start: 2019-01-01, end: 2024-12-31 }
  recent: { start: 2025-01-01, end: 2026-09-06 }
  walk_forward:
    window_years: 3
    step_months: 12
    purge_days: 21
    embargo_days: 5

# ALPHA_CHARTER.md section 11.
benchmarks:
  primary: VTI
  cash: BIL
  exposure_matched: true
  volatility_controlled_primary: true
  equal_weight_risk_etfs: true
  secondary: [SPY]
  # 0.3.0, OD-9: the owner's confirmation of the two readings section 11 leaves silent. The schema admits only
  # the values the code implements.
  secondary_2_readings:
    rescale: WEEKLY_AT_DECISION_INSTANTS
    ex_date_rebalance_income: CASH_REALLOCATED_AT_OPEN

# ALPHA_CHARTER.md sections 13 and 16.
pass_fail:
  primary_metric: net_sharpe_difference_vs_primary_benchmark
  primary_threshold: "0.10"
  bootstrap_block_sessions: 21
  bootstrap_confidence: "0.90"
  max_drawdown_ratio: "0.75"
  min_grid_sign_agreement: "0.75"
  # 0.3.0, OD-8: the registered walk-forward schedule's capacity (102 blocks), not an independent statistical
  # requirement. 0.2.0 said 150, which no schedule inside the design window can reach.
  minimum_independent_decisions: 100
  falsifiers:
    - id: F1
      condition: "Primary metric point estimate below the threshold, or the bootstrap interval includes zero."
    - id: F2
      condition: "Maximum drawdown not at or below max_drawdown_ratio times the primary benchmark's maximum drawdown. On the aggregate walk-forward out-of-sample set it is read on the chain-linked curves of the strategy and the primary benchmark (OD-6)."
    - id: F3
      condition: "Sign of the primary metric flips under adverse costs or one extra session of execution delay."
    - id: F4
      condition: "Removing the single best 12-month window flips the sign (single-episode dependence)."
    - id: F5
      condition: "Fewer than min_grid_sign_agreement of sensitivity-grid members agree in sign."
    - id: F6
      condition: "Prospective: after 36 months the rolling paired excess return versus the primary benchmark is below the 10th percentile of the historical block-bootstrap distribution. Triggers PAUSE and review, never silent tuning."
  # 0.3.0, OD-5: ACTIVE needs the primary metric passed AND these cleared on the aggregate walk-forward set.
  promotion_co_gates: [F2]
  # 0.3.0, OD-7: primary fails + Secondary 2 beaten -> owner review, never ACTIVE.
  mixed_verdict: OWNER_REVIEW_NEVER_ACTIVE

# ALPHA_CHARTER.md section 15. 2 x 2 x 1 x 3 x 3 x 2 = 72 members; the registered point is one of them.
sensitivity_grid:
  momentum:
    - { lookback_sessions: 126, skip_sessions: 21 }
    - { lookback_sessions: 252, skip_sessions: 21 }
  trend_sma_sessions: [150, 200]
  volatility_sessions: [63]
  ranks:
    - { entry: 4, hold: 6 }
    - { entry: 5, hold: 7 }
    - { entry: 6, hold: 8 }
  annual_volatility_target: ["0.08", "0.10", "0.12"]
  rebalance_band_pct_points: ["1.0", "2.0"]

tax_scenarios: [pre_tax, taxable_short_long_split, tax_deferred]

# ALPHA_CHARTER.md section 23, carried verbatim into every result report.
reasons_it_may_not_work:
  - "Trend and momentum on U.S. equity ETFs have been weaker since 2009 than before; the design period may flatter the rule."
  - "2020 shows the cost of the trend flag: exit into the March low, re-enter in June. A rule that survives 2008 can still lose to VTI over a decade."
  - "Volatility targeting lowers CAGR in long calm bull markets; the Sharpe gain may not translate into wealth gain, and taxes on short-term gains erode it further."
  - "Weekly rebalancing at a small account produces many small trades whose fixed frictions may exceed assumptions."
  - "The universe is mostly one asset class. Most published trend-following success comes from multi-asset diversification, which this charter deliberately excludes in version 0.1."
  - "Beating the volatility-controlled primary benchmark is a high bar. If the whole benefit is volatility control, the honest conclusion is hold VTI and scale it, which is a simpler charter."
  - "The result may be real and still too small to matter after tax at sleeve scale."

component_versions:
  # 1 -> 2 in 0.3.0: matches the code's FEATURES_VERSION since the corporate-action dedupe fix (2026-09-21).
  # Byte-identical features on every store that exists; provenance, not a superseding change.
  features: 2
  strategy_rules: 1
  portfolio_construction: 1
  risk_policy: 0
  cost_model: 1
