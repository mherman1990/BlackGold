name: release-verify

# Manual post-publication verification. Confirms the published manifest carries both architectures,
# that the compose file pins the same tag and digest, and that a disposable amd64 install starts healthy.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v, e.g. 0.1.0"
        required: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: inspect manifest
        run: |
          set -euo pipefail
          REF="ghcr.io/mherman1990/blackgold:${{ inputs.version }}"
          docker buildx imagetools inspect "$REF" | tee inspect.txt
          grep -q "linux/amd64" inspect.txt
          grep -q "linux/arm64" inspect.txt
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$DIGEST" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "ghcr.io/mherman1990/blackgold:${{ inputs.version }}@$DIGEST" blackgold-trading/docker-compose.yml \
            || { echo "compose does not pin ${{ inputs.version }}@$DIGEST"; exit 1; }
      - name: disposable install smoke test
        run: |
          set -euo pipefail
          mkdir -p appdata/data
          # The container runs as USER 1000:1000 and a bind mount keeps the HOST directory's ownership,
          # ignoring the `chown 1000:1000 /data` the image does at build time. The runner's own uid is not
          # 1000, so without this the very first write fails and the test proves nothing about the appliance.
          # umbrelOS owns APP_DATA_DIR as uid 1000, so chowning to 1000 is what makes this test represent the
          # Pi rather than the runner.
          sudo chown -R 1000:1000 appdata/data
          docker run --rm -v "$PWD/appdata/data:/data" -e BLACKGOLD_DATA_DIR=/data \
            "ghcr.io/mherman1990/blackgold:${{ inputs.version }}" packages/core/dist/main.js migrate
          docker run --rm -v "$PWD/appdata/data:/data" -e BLACKGOLD_DATA_DIR=/data \
            "ghcr.io/mherman1990/blackgold:${{ inputs.version }}" packages/core/dist/main.js health | tee health.json
          node -e "const h=require('./health.json');if(!h.ok||h.liveCapable!==false)process.exit(1)"
          ls -la appdata/data

          # Negative case: an unwritable data directory must fail closed, leaving nothing half-written.
          #
          # This workflow verifies a PUBLISHED image, so it may only assert behaviour that image actually
          # has. An earlier version of this step grepped for `DataDirNotWritableError`, which no image
          # before 0.1.1 can produce - coupling a published-image check to unpublished code and making the
          # workflow unable to pass against the very release it was written for. The error *message* is a
          # unit-test concern and is covered in packages/core/test/db.test.ts; what belongs here is the
          # version-independent invariant an operator depends on.
          mkdir -p appdata/unwritable
          sudo chown -R 0:0 appdata/unwritable
          sudo chmod 555 appdata/unwritable
          if docker run --rm -v "$PWD/appdata/unwritable:/data" -e BLACKGOLD_DATA_DIR=/data \
               "ghcr.io/mherman1990/blackgold:${{ inputs.version }}" packages/core/dist/main.js migrate > unwritable.json 2>&1; then
            echo "expected migrate to fail on an unwritable data dir, but it succeeded"; exit 1
          fi
          cat unwritable.json
          # Whatever the wording, it must name a database problem rather than crash unrecognisably.
          grep -qi "database\|data dir" unwritable.json
          # And it must not have created a database it cannot maintain: a partially initialised store is
          # worse than none, because `health` would then report on a schema that never finished migrating.
          if sudo ls appdata/unwritable | grep -q .; then
            echo "refused run left files behind in the data directory:"; sudo ls -la appdata/unwritable; exit 1
          fi
