    find: '`%"${NO_SHADOW_CLOCK_LABEL}"%`'
    replace: '`%"NEVER_A_LABEL"%`'
    test: packages/core/test/shadow-job.test.ts
    testName: "never starts sealing on a registration labelled NO_SHADOW_CLOCK"
